<style>
/* ============================================================
   COMO PEGAR EN TU HOME (VS Code):
     1. Copia todo lo de adentro de la etiqueta de estilos a tu
        head o a tu archivo css. Si ya tienes las variables root
        en el home, no las repitas.
     2. Copia la seccion (la etiqueta con clase dest) donde
        quieras que aparezca en el home.
     3. Copia el bloque de script antes de cerrar el body.
   Cambia fotos, textos y precios en el objeto EXCURSIONES.
   Los botones apuntan a reservar.html y detalle-excursion.html.
   ============================================================ */
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --sand:#fbf7ef; --panel:#fff; --ink:#1b241e; --muted:#5c6b60; --line:#e8e1d5;
  --g:#12854c; --g-d:#0b5a34; --g2:#1a9e5c; --b:#0e86bd; --o:#e0742a; --o-d:#b0430f;
}
body{ font-family:'Be Vietnam Pro',sans-serif; background:var(--sand); color:var(--ink);
  -webkit-font-smoothing:antialiased; }
img{ display:block; max-width:100%; }

/* ===== SECCION ===== */
.dest{ padding:clamp(48px,7vw,86px) 0; }
.dest .wrap{ max-width:1300px; margin:0 auto; padding:0 clamp(22px,5vw,54px); }
.dest-head{ text-align:center; margin-bottom:clamp(26px,4vw,38px); }
.dest-pill{ display:inline-block; font-family:'Plus Jakarta Sans'; font-weight:700; font-size:11.5px;
  letter-spacing:.2em; text-transform:uppercase; padding:8px 17px; border-radius:100px;
  margin-bottom:16px; background:#fdeadb; color:var(--o-d); }
.dest-head h2{ font-family:'Plus Jakarta Sans'; font-weight:800; font-size:clamp(28px,3.8vw,44px);
  letter-spacing:-.022em; line-height:1.08; color:var(--ink); }
.dest-head h2 span{ color:var(--g); position:relative; white-space:nowrap; }
.dest-head h2 span::after{ content:''; position:absolute; left:0; right:0; bottom:-4px; height:5px;
  border-radius:5px; background:linear-gradient(90deg,var(--g2),var(--o)); }
.dest-head p{ color:var(--muted); font-size:16px; margin-top:14px; max-width:52ch; margin-inline:auto; }

/* ===== TABS por destino ===== */
.dtabs{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-bottom:clamp(28px,4vw,42px); }
.dtab{ font-family:'Plus Jakarta Sans'; font-weight:700; font-size:14px; color:var(--muted);
  background:#fff; border:1.6px solid var(--line); padding:11px 24px; border-radius:100px;
  cursor:pointer; transition:color .25s, background .25s, border-color .25s, transform .2s; }
.dtab:hover{ color:var(--ink); border-color:#d9cfbe; transform:translateY(-2px); }
.dtab.on{ color:#fff; background:var(--g); border-color:var(--g); box-shadow:0 12px 24px -12px rgba(18,133,76,.8); }

/* ===== CARRUSEL horizontal de tarjetas ===== */
.dcarousel{ position:relative; display:flex; align-items:center; gap:12px; }
.dviewport{ overflow:hidden; flex:1; padding:6px; margin:-6px; }
.dtrack{ display:flex; gap:clamp(18px,2vw,24px);
  transition:transform .5s cubic-bezier(.2,.8,.3,1); }
/* cada tarjeta ocupa 1/3 en escritorio */
.dtrack > .card{ flex:0 0 calc((100% - 2 * clamp(18px,2vw,24px)) / 3); }
@media(max-width:1000px){ .dtrack > .card{ flex:0 0 calc((100% - 1 * clamp(18px,2vw,24px)) / 2); } }
@media(max-width:660px){ .dtrack > .card{ flex:0 0 100%; } }

/* flechas a los lados */
.dnav{ flex-shrink:0; width:48px; height:48px; border-radius:50%; border:1.6px solid var(--line);
  background:#fff; color:var(--ink); cursor:pointer; display:grid; place-items:center;
  transition:background .25s, color .25s, border-color .25s, transform .2s, opacity .25s;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.4); }
.dnav:hover{ background:var(--g); color:#fff; border-color:var(--g); transform:scale(1.06); }
.dnav:disabled{ opacity:.35; cursor:default; }
.dnav:disabled:hover{ background:#fff; color:var(--ink); border-color:var(--line); transform:none; }
@media(max-width:660px){ .dnav{ display:none; } }

/* barra de progreso debajo */
.dprogress{ display:flex; gap:7px; justify-content:center; margin-top:26px; }
.dprogress .pg{ width:24px; height:5px; border-radius:100px; background:var(--line); cursor:pointer;
  transition:background .3s, width .3s; }
.dprogress .pg.on{ background:var(--g); width:38px; }

/* ===== TARJETA ===== */
.card{ background:#fff; border:1px solid var(--line); border-radius:22px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:0 30px 60px -50px rgba(0,0,0,.5);
  transition:transform .4s cubic-bezier(.2,.8,.3,1), box-shadow .4s, border-color .4s;
  animation:cardIn .5s cubic-bezier(.2,.8,.3,1) both; }
.card:hover{ transform:translateY(-5px); box-shadow:0 46px 84px -46px rgba(0,0,0,.45); border-color:#d9cfbe; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(22px);} to{ opacity:1; transform:none;} }

/* --- carrusel de fotos --- */
.media{ position:relative; aspect-ratio:16/11; overflow:hidden; background:#0d1a13; }
.slides{ display:flex; height:100%; transition:transform .5s cubic-bezier(.2,.8,.3,1); }
.slides img{ min-width:100%; height:100%; object-fit:cover; }
.media::after{ content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top,rgba(8,20,14,.5),transparent 46%); }
.arrow{ position:absolute; top:50%; transform:translateY(-50%); z-index:4; width:34px; height:34px;
  border-radius:50%; border:none; background:rgba(255,255,255,.9); color:var(--ink); cursor:pointer;
  display:grid; place-items:center; opacity:0; transition:opacity .25s, background .2s; }
.card:hover .arrow{ opacity:1; }
.arrow:hover{ background:#fff; }
.arrow.prev{ left:10px; } .arrow.next{ right:10px; }
.dots{ position:absolute; left:0; right:0; bottom:11px; z-index:4; display:flex; gap:6px; justify-content:center; }
.dot{ width:7px; height:7px; border-radius:100px; background:rgba(255,255,255,.55); transition:width .3s, background .3s; cursor:pointer; }
.dot.on{ width:20px; background:#fff; }
.time{ position:absolute; top:12px; left:12px; z-index:3; display:inline-flex; align-items:center; gap:6px;
  font-family:'Plus Jakarta Sans'; font-weight:700; font-size:12px; color:var(--ink);
  background:rgba(255,255,255,.92); padding:6px 12px; border-radius:100px; }
.tag{ position:absolute; top:12px; right:12px; z-index:3; font-family:'Plus Jakarta Sans'; font-weight:700;
  font-size:11px; color:#fff; padding:6px 12px; border-radius:100px; }
.tag.fav{ background:var(--g); } .tag.hot{ background:var(--o); } .tag.top{ background:var(--b); }
.rate{ position:absolute; bottom:12px; right:12px; z-index:3; display:inline-flex; align-items:center; gap:4px;
  font-family:'Plus Jakarta Sans'; font-weight:700; font-size:12px; color:#fff;
  background:rgba(6,16,11,.55); backdrop-filter:blur(8px); padding:5px 10px; border-radius:100px; }
.rate svg{ color:#ffc94d; }

/* --- cuerpo --- */
.body{ padding:20px 20px 22px; display:flex; flex-direction:column; flex:1; }
.body h3{ font-family:'Plus Jakarta Sans'; font-weight:800; font-size:20px; letter-spacing:-.02em; line-height:1.14; margin-bottom:7px; }
.zona{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--g-d); margin-bottom:11px; flex-wrap:wrap; }
.zona .viaj{ color:var(--muted); font-weight:500; }
.hook{ font-size:13.5px; color:var(--muted); line-height:1.55; margin-bottom:16px; }
.meta{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px 0; margin-bottom:6px;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.meta > div{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
.meta b{ font-family:'Plus Jakarta Sans'; font-weight:700; color:var(--ink); }
.meta svg{ color:var(--g); flex-shrink:0; }
.nivel{ display:inline-flex; align-items:center; gap:4px; font-family:'Plus Jakarta Sans'; font-weight:700;
  font-size:11px; padding:3px 9px; border-radius:100px; background:#e4f2ea; color:var(--g-d); }

/* chips / listas */
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink);
  background:var(--sand); border:1px solid var(--line); padding:5px 11px; border-radius:100px; }
.chip svg{ color:var(--g); }
.hchip{ font-family:'Plus Jakarta Sans'; font-weight:700; font-size:12px; color:var(--ink);
  background:#fff; border:1.5px solid var(--line); padding:5px 12px; border-radius:100px; }
.facts{ display:flex; flex-direction:column; gap:8px; }
.fact{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink); }
.fact svg{ color:var(--g); flex-shrink:0; }
.fact.no{ color:var(--muted); } .fact.no svg{ color:var(--muted); }

/* acordeón */
.acc{ border-top:1px solid var(--line); margin-bottom:2px; }
.acc-item{ border-bottom:1px solid var(--line); }
.acc-head{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:none; border:none; cursor:pointer; padding:13px 2px; font-family:'Be Vietnam Pro';
  font-size:13.5px; font-weight:600; color:var(--ink); text-align:left; }
.acc-head .ic{ display:flex; align-items:center; gap:9px; }
.acc-head .ic > svg{ color:var(--g); }
.acc-head .chev{ transition:transform .3s; color:var(--muted); }
.acc-item.open .chev{ transform:rotate(180deg); }
.acc-panel{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
.acc-panel .inner{ padding:2px 2px 15px; }
.acc-item.open .acc-panel{ max-height:340px; }

/* paybox */
.paybox{ position:relative; background:linear-gradient(120deg,#eafaef,#d6f0e0);
  border:2px solid var(--g); border-radius:14px; padding:14px 16px; margin:16px 0;
  box-shadow:0 8px 22px -12px rgba(18,133,76,.5); animation:glow 2.4s ease-in-out infinite; }
@keyframes glow{ 0%,100%{ box-shadow:0 8px 22px -12px rgba(18,133,76,.5) } 50%{ box-shadow:0 8px 30px -6px rgba(18,133,76,.75) } }
.paybox .h{ display:flex; align-items:center; gap:7px; font-family:'Plus Jakarta Sans'; font-weight:700;
  font-size:11px; letter-spacing:.02em; text-transform:uppercase; color:var(--g-d); margin-bottom:7px; }
.paybox .h svg{ color:var(--g); }
.paybox .m{ display:flex; align-items:center; gap:8px; }
.paybox .m b{ font-family:'Plus Jakarta Sans'; font-weight:800; font-size:22px; color:var(--o-d); }
.paybox .pct{ background:var(--o); color:#fff; font-weight:800; font-size:11px; padding:3px 10px; border-radius:100px; }
.paybox .s{ font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.45; }

/* precio + botones */

.price .from{ font-size:12px; color:var(--muted); }
.price .amt{ font-family:'Plus Jakarta Sans'; font-weight:800; font-size:28px; color:var(--g-d); letter-spacing:-.02em; }
.price .per{ font-size:12px; color:var(--muted); }
.btns{ display:flex; flex-direction:column; gap:9px; margin-top:auto; }
.btn{ display:flex; align-items:center; gap:10px; text-decoration:none; border-radius:14px; padding:13px 16px;
  transition:transform .25s, background .3s, border-color .3s, box-shadow .3s; position:relative; overflow:hidden; }
.btn span{ display:flex; flex-direction:column; line-height:1.2; }
.btn b{ font-family:'Plus Jakarta Sans'; font-weight:700; font-size:14.5px; }
.btn small{ font-size:11px; opacity:.85; font-weight:500; }
.btn svg{ flex-shrink:0; }
.btn-go{ background:var(--g); color:#fff; justify-content:center; box-shadow:0 14px 26px -14px rgba(18,133,76,.9); }
.btn-go::after{ content:''; position:absolute; top:0; left:-60%; width:45%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent); transform:skewX(-20deg); pointer-events:none; }
.btn-go:hover{ background:var(--g-d); transform:translateY(-2px); box-shadow:0 20px 34px -14px rgba(18,133,76,.95); }
.btn-go:hover::after{ animation:shine .85s cubic-bezier(.3,.7,.4,1) forwards; }
@keyframes shine{ to{ left:130%; } }
.btn-alt{ background:#fff; color:var(--ink); border:1.5px solid #cfe4d7; justify-content:space-between; }
.btn-alt small{ color:var(--muted); }
.btn-alt svg{ color:var(--g); background:#eef7f1; border-radius:50%; padding:6px; width:28px; height:28px; box-sizing:border-box; transition:.3s; }
.btn-alt:hover{ background:#f5faf6; border-color:var(--g); transform:translateY(-2px); }
.btn-alt:hover svg{ background:var(--g); color:#fff; transform:translateX(3px); }

@media(prefers-reduced-motion:reduce){ .card,.paybox{ animation:none; } }
</style>

};

function cardHTML(t){
  const slides = t.fotos.map(f=>`<img src="${PIC(f)}" alt="${t.name}" loading="lazy">`).join('');
  const dots = t.fotos.map((_,i)=>`<span class="dot${i===0?' on':''}"></span>`).join('');
  const nav = t.fotos.length>1 ? `
      <button class="arrow prev" aria-label="Anterior">${I.chevL}</button>
      <button class="arrow next" aria-label="Siguiente">${I.chevR}</button>
      <div class="dots">${dots}</div>` : '';
  const tagHTML = t.tag ? `<span class="tag ${t.tag}">${t.tag==='fav'?I.star:''}${t.tagText}</span>` : '';
  const chips = t.incluye.map(x=>`<span class="chip">${I.check}${x}</span>`).join('');
  const sal = t.salidas.map(h=>`<span class="hchip">${h}</span>`).join('');
  const facts = t.facts.map(([ic,tx,no])=>`<span class="fact${no?' no':''}">${I[ic]}${tx}</span>`).join('')
      + `<span class="fact">${I.bag} Lleva: ${t.llevar.join(', ')}</span>`
      + (t.cancela?`<span class="fact">${I.check}${t.cancela}</span>`:'');
  return `
  <article class="card" data-fotos="${t.fotos.length}">
    <div class="media">
      <div class="slides">${slides}</div>
      <span class="time">${I.clock} ${t.time}</span>
      ${tagHTML}
      <span class="rate">${I.star} ${t.rating} (${t.reviews})</span>
      ${nav}
    </div>
    <div class="body">
      <h3>${t.name}</h3>
      <p class="zona">${I.pin}${t.zona} <span class="viaj">· +${t.viajeros.toLocaleString('es-DO')} ya fueron</span></p>
      <p class="hook">${t.hook}</p>
      <div class="meta">
        <div>${I.clock}<b>${t.time}</b></div>
        <div><span class="nivel">${I.bolt}${t.nivel}</span></div>
        <div>${I.chat}${t.idiomas}</div>
      </div>
      <div class="acc">
        <div class="acc-item">
          <button class="acc-head"><span class="ic">${I.check} Que incluye</span><span class="chev">${I.chevD}</span></button>
          <div class="acc-panel"><div class="inner"><div class="chips">${chips}</div></div></div>
        </div>
        <div class="acc-item">
          <button class="acc-head"><span class="ic">${I.sun} Horarios de salida</span><span class="chev">${I.chevD}</span></button>
          <div class="acc-panel"><div class="inner"><div class="chips">${sal}</div></div></div>
        </div>
        <div class="acc-item">
          <button class="acc-head"><span class="ic">${I.bag} Detalles y que llevar</span><span class="chev">${I.chevD}</span></button>
          <div class="acc-panel"><div class="inner"><div class="facts">${facts}</div></div></div>
        </div>
      </div>
      <div class="paybox">
        <div class="h">${I.shield} Aparta con solo</div>
        <div class="m"><b>US$${t.abono}</b> <span class="pct">20%</span></div>
        <div class="s">El resto lo pagas al subir a la guagua. Confirmacion al instante.</div>
      </div>
      <div class="price"><span class="from">Desde</span><span class="amt">US$${t.price}</span><span class="per">/persona</span></div>
      <div class="btns">
        <a class="btn btn-go" href="${RESERVA}?id=${t.id}"><span><b>Reservar ahora</b></span> ${I.arrow}</a>
        <a class="btn btn-alt" href="${DETALLE}?id=${t.id}"><span><b>Ver todos los detalles</b><small>Videos, opiniones y mas</small></span>${I.arrow}</a>
      </div>
    </div>
  </article>`;
}

function render(dest){
  const lista = EXCURSIONES.filter(t=>t.dest===dest);
  document.getElementById('dgrid').innerHTML = lista.map(cardHTML).join('');
  wireCards();
  initCarousel();  // reinicia el carrusel de tarjetas
}

/* ===== carrusel horizontal de TARJETAS ===== */
let carPos = 0;
function perView(){
  const w = window.innerWidth;
  if(w <= 660) return 1;
  if(w <= 1000) return 2;
  return 3;
}
function initCarousel(){
  carPos = 0;
  updateCarousel();
}
function updateCarousel(){
  const track = document.getElementById('dgrid');
  const cards = [...track.children];
  const pv = perView();
  const total = cards.length;
  const maxPos = Math.max(0, total - pv);
  if(carPos > maxPos) carPos = maxPos;

  // mover el track: cada paso = ancho de tarjeta + gap
  if(cards.length){
    const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    const cardW = cards[0].getBoundingClientRect().width;
    track.style.transform = `translateX(-${carPos * (cardW + gap)}px)`;
  }

  // flechas
  const prev = document.getElementById('navPrev');
  const next = document.getElementById('navNext');
  prev.disabled = carPos <= 0;
  next.disabled = carPos >= maxPos;

  // barra de progreso (una por posición posible)
  const steps = maxPos + 1;
  const prog = document.getElementById('dprogress');
  prog.innerHTML = '';
  if(steps > 1){
    for(let i=0;i<steps;i++){
      const p = document.createElement('span');
      p.className = 'pg' + (i===carPos?' on':'');
      p.onclick = ()=>{ carPos = i; updateCarousel(); };
      prog.appendChild(p);
    }
  }
}
document.getElementById('navPrev').onclick = ()=>{ carPos--; updateCarousel(); };
document.getElementById('navNext').onclick = ()=>{ carPos++; updateCarousel(); };
// iconos de las flechas
document.getElementById('navPrev').innerHTML = I.chevL;
document.getElementById('navNext').innerHTML = I.chevR;
// al cambiar el tamaño de la ventana, recalcular
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(updateCarousel,150); });

function wireCards(){
  // carrusel
  document.querySelectorAll('.card').forEach(card=>{
    const slides = card.querySelector('.slides');
    const dots = [...card.querySelectorAll('.dot')];
    const n = +card.dataset.fotos; let i = 0;
    const go = k => { i=(k+n)%n; slides.style.transform=`translateX(-${i*100}%)`;
      dots.forEach((d,j)=>d.classList.toggle('on', j===i)); };
    const prev = card.querySelector('.arrow.prev');
    const next = card.querySelector('.arrow.next');
    if(prev) prev.onclick = e=>{ e.preventDefault(); go(i-1); };
    if(next) next.onclick = e=>{ e.preventDefault(); go(i+1); };
    dots.forEach((d,j)=>d.onclick=()=>go(j));
  });
  // acordeón
  document.querySelectorAll('.acc-head').forEach(h=>{
    h.onclick = ()=> h.closest('.acc-item').classList.toggle('open');
  });
}

document.getElementById('dtabs').addEventListener('click', e=>{
  const btn = e.target.closest('.dtab');
  if(!btn) return;
  document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  render(btn.dataset.dest);
});

render('punta-cana');
</script>
